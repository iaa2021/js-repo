<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTTPS Chat</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/chat.js" defer></script>
</head>
<body>
    <main class="chat">
        <form id="join-form">
            <label for="username">Enter your username:</label>
            <input id="username" maxlength="30" placeholder="Username?" required>
            <button type="submit">Join Chat</button>
        </form>
        <section id="chat-area" hidden>
            <ul id="messages" aria-live="polite"></ul>
            <form id="message-form">
                <input id="message-input" maxlength="1000"
                 placeholder="Type a message..." 
                 autocomplete="off" required>
                <button type="submit">Send</button>
            </form>
            <button id="leave-btn" type="button">Leave Chat</button>
        </section>
    </main>
</body>
</html>
